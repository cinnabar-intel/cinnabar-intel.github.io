<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600;700&display=swap');
    </style>
  </defs>

  <!-- Deep ink ground — oklch(15% 0.02 60) -->
  <rect width="500" height="400" fill="#1D1915"/>

  <!--
    Dark variant: cream letters, cinnabar W.
    Same committed accent logic — cinnabar W is the signal.
  -->
  <text
    font-family="'Geist Mono', 'Courier New', monospace"
    font-weight="700"
    font-size="164"
    text-anchor="middle"
    x="250"
    y="168"
    letter-spacing="2"
  ><tspan fill="#F7F1E8">P</tspan><tspan fill="#C84530">W</tspan><tspan fill="#F7F1E8">P</tspan></text>

  <!-- Cinnabar rule -->
  <line x1="80" y1="193" x2="420" y2="193" stroke="#C84530" stroke-width="1.5"/>

  <!-- Wordmark: POSSIBILITIES -->
  <text
    font-family="'Geist Mono', 'Courier New', monospace"
    font-weight="600"
    font-size="18"
    text-anchor="middle"
    x="250"
    y="234"
    fill="#F7F1E8"
    letter-spacing="7"
  >POSSIBILITIES</text>

  <!-- WITH connector -->
  <line x1="100" y1="253" x2="208" y2="253" stroke="#F7F1E8" stroke-width="0.5" opacity="0.25"/>
  <text
    font-family="'Geist Mono', 'Courier New', monospace"
    font-weight="400"
    font-size="10"
    text-anchor="middle"
    x="250"
    y="257"
    fill="#F7F1E8"
    letter-spacing="12"
  >WITH</text>
  <line x1="292" y1="253" x2="400" y2="253" stroke="#F7F1E8" stroke-width="0.5" opacity="0.25"/>

  <!-- Wordmark: PROBABILITIES -->
  <text
    font-family="'Geist Mono', 'Courier New', monospace"
    font-weight="600"
    font-size="18"
    text-anchor="middle"
    x="250"
    y="289"
    fill="#F7F1E8"
    letter-spacing="7"
  >PROBABILITIES</text>

  <!-- Tagline in cinnabar -->
  <text
    font-family="'Geist Mono', 'Courier New', monospace"
    font-weight="400"
    font-size="10"
    text-anchor="middle"
    x="250"
    y="340"
    fill="#C84530"
    letter-spacing="3"
  >INSIGHT TODAY. IMPACT TOMORROW.</text>

</svg>
