<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600;700&display=swap');
    </style>
  </defs>

  <!-- Warm cream ground — oklch(96% 0.01 85) -->
  <rect width="500" height="400" fill="#F7F1E8"/>

  <!--
    MONOGRAM: P(ink) · W(cinnabar) · P(ink)
    W in cinnabar = the committed accent, the signal between the two poles.
    "Possibilities" and "Probabilities" bracket the bridge.
  -->
  <text
    font-family="'Geist Mono', 'Courier New', monospace"
    font-weight="700"
    font-size="164"
    text-anchor="middle"
    x="250"
    y="168"
    letter-spacing="2"
  ><tspan fill="#1D1915">P</tspan><tspan fill="#C84530">W</tspan><tspan fill="#1D1915">P</tspan></text>

  <!-- Cinnabar rule — the single chromatic actor, used as structural separator -->
  <line x1="80" y1="193" x2="420" y2="193" stroke="#C84530" stroke-width="1.5"/>

  <!-- Wordmark: POSSIBILITIES -->
  <text
    font-family="'Geist Mono', 'Courier New', monospace"
    font-weight="600"
    font-size="18"
    text-anchor="middle"
    x="250"
    y="234"
    fill="#1D1915"
    letter-spacing="7"
  >POSSIBILITIES</text>

  <!-- WITH: connector — small cap, heavy tracking, flanked by hairlines -->
  <line x1="100" y1="253" x2="208" y2="253" stroke="#1D1915" stroke-width="0.5" opacity="0.3"/>
  <text
    font-family="'Geist Mono', 'Courier New', monospace"
    font-weight="400"
    font-size="10"
    text-anchor="middle"
    x="250"
    y="257"
    fill="#1D1915"
    letter-spacing="12"
  >WITH</text>
  <line x1="292" y1="253" x2="400" y2="253" stroke="#1D1915" stroke-width="0.5" opacity="0.3"/>

  <!-- Wordmark: PROBABILITIES (corrected from source logo's "PROBABILITY") -->
  <text
    font-family="'Geist Mono', 'Courier New', monospace"
    font-weight="600"
    font-size="18"
    text-anchor="middle"
    x="250"
    y="289"
    fill="#1D1915"
    letter-spacing="7"
  >PROBABILITIES</text>

  <!-- Tagline in cinnabar — the brand's call to action -->
  <text
    font-family="'Geist Mono', 'Courier New', monospace"
    font-weight="400"
    font-size="10"
    text-anchor="middle"
    x="250"
    y="340"
    fill="#C84530"
    letter-spacing="3"
  >INSIGHT TODAY. IMPACT TOMORROW.</text>

</svg>
